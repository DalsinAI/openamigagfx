name: m68k (OpenGfx and OpenLayers cores)

# OpenGfx's core is plain C that runs on a real 68k: built by an m68k cross
# GCC for the 68000, 68020 and 68040 and run under qemu-m68k on every change.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/check-m68k.yml
      - library/core/**
      - library/layers/**
      - library/text/**
      - tests/TextABITest.c
      - tests/host-ndk/**
      - tests/m68k/**
      - tests/abihost/**
      - tests/LayersABITest.c
      - library/graphics/**
      - tests/GfxFaceABITest.c
      - library/gels/**
      - tests/GelsABITest.c

permissions:
  contents: read

jobs:
  m68k:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: m68k cross GCC and qemu-m68k
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu g++-m68k-linux-gnu qemu-user
      - name: OpenGfx core
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_gfx_core.sh
      - name: OpenLayers core
        run: QEMU_M68K=qemu-m68k HOST_CC=gcc sh tests/m68k/test_layers_core.sh
      - name: OpenLayers library
        run: QEMU_M68K=qemu-m68k HOST_CC=gcc sh tests/m68k/test_layers_lib.sh
      - name: LayersABITest on the host
        run: HOST_CC=gcc sh tests/abihost/run.sh ROUNDS=3 > /dev/null
      - name: OpenGfx regions
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_gfx_region.sh
      - name: OpenGfx graphics.library face
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_gfx_face.sh
      - name: OpenGfx text
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_gfx_text.sh
      - name: OpenGfx gels and the blitter
        run: QEMU_M68K=qemu-m68k sh tests/m68k/test_gfx_gels.sh
